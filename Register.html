<!DOCTYPE html>
<html dir="rtl" lang="fa">
    <head>
        <title>ثبت نام</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="./Style.css">
    </head>
    <body>
        <h1>ثبت نام</h1>
        <form action="#">
            <label>نام</label>
            <br>
            <input type="text" name="Name" required>
            <br><br>

            <label>ایمیل</label>
            <br>
            <input type="email" name="Email" required>
            <br><br>

            <label>تاریخ تولد</label>
            <br>
            <input type="date" name="b-day" required>
            <br><br>

            <label>توضیحات</label>
            <br>
            <textarea cols="30" rows="5" name="Description" required></textarea>
            <br><br>

            <h2>Sender: </h2>
            <label>
                <input type="radio" name="sender" value="Mr. Big Boss" required>
                Mr. Big Boss
            </label>

            <label>
                <input type="radio" name="sender" value="Alireza" required>
                Alireza
            </label>

            <label>
                <input type="radio" name="sender" value="Delara" required>
                Delara
            </label>

            <label>
                <input type="radio" name="sender" value="Mehrana" required>
                Mehrana
            </label>
            <br><br>

            <label>اشتراک</label>
            <br>
            <select name="category" required>
                <option value="Option-1">رایگان</option>
                <option value="Option-2">برنز</option>
                <option value="Option-3">طلا</option>
                <option value="Option-4">الماس</option>
            </select>
            <br><br>

            <button type="submit">ثبت نام</button>
        </form>
    </body>
</html>

<!--  یک صفحه معمولی برای ثبت نام در کنارش یک حالت هم بذار با نام هکر که وقتی روی اون زد وارد یک صفحه کالی لینوکس بشه
  و حالا با یک حالتی مثل ساخت فایل ثبت نام یا وارد ترمینال شدن و وارد کردن دستورات خاص فرآیند ثبت نام رو انجام بده -->
